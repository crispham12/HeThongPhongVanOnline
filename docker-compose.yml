version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interviewpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - postgres

  server-dotnet:
    build: ./server-dotnet
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=interviewpro;Username=postgres;Password=password"
      Jwt__Key: "YourSuperSecretKeyMustBe32CharactersLong!!"
      Jwt__Issuer: "InterviewProAPI"
      Jwt__Audience: "InterviewProClient"
      AiService__BaseUrl: "http://ai-service:8000"
    depends_on:
      - postgres
      - ai-service

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server-dotnet

volumes:
  pgdata:
